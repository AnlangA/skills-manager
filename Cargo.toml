[workspace]
members = [
    "crates/skills-manager-core",
    "crates/skills-manager-cli",
    "crates/skills-manager-ui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://example.invalid/skills-manager"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
iced = { version = "0.14.0", features = ["tokio"] }
iced_aw = { version = "0.14.1", default-features = false, features = ["badge", "sidebar", "tabs", "spinner"] }
iced_lucide = "0.1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.14"
thiserror = "2.0"
toml = "0.9"
toml_edit = "0.23"
url = "2.5"
walkdir = "2.5"
zip = { version = "4.3", default-features = false, features = ["deflate"] }
